<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FilmData - Movie Search</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Karma:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="favicon/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <header class="header">
            <h1 class="title"><i class="fas fa-film"></i> FilmData</h1>
            <p class="subtitle">Discover movies from around the world</p>
        </header>

        <div class="search-section">
            <div class="search-box">
                <input
                    type="text"
                    id="movieInput"
                    class="search-input"
                    placeholder="Enter movie name or title..."
                    aria-label="Search for movies">
                <button class="search-button" id="searchBtn" aria-label="Search">
                    <i class="fas fa-search"></i> Search
                </button>
            </div>
        </div>

        <div id="results-container" class="results-container"></div>

        <div id="loading" class="loading hidden">
            <div class="spinner"></div>
            <p>Searching for movies...</p>
        </div>

        <div id="error-message" class="error-message hidden"></div>
    </div>

    <script src="film_data.js"></script>
</body>

</html>
